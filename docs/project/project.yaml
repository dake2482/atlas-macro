    - Census MARTS release transport retries are implemented: transient httpx.TransportError failures (timeouts, connection resets) and the transient status set {429, 500, 502, 503, 504} are retried against the exact same URL, capped at three total tries with monotone backoff. A successful 200 and the proof-chain terminal states 403/404/410 are exact evidence states and are returned immediately, so the retry loop never changes the persisted status or weakens the fail-closed proof chain; only the final attempt's bytes and retrieved_at are persisted. Thirteen deterministic retry tests cover transient-status recovery, read/connect-timeout recovery, probe fallback after retries, exhaustion-then-fail-closed, no-retry of terminal proof states, and bounded monotone backoff.
