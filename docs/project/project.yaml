schema_version: 1
project_id: AI-RESEARCH
name: Atlas Macro
purpose: Build a clean-room macro-research and AI supply-chain intelligence platform with traceable public sources, explicit data-quality labels, and original presentation.
success_metrics:
  - Public research outputs preserve source lineage, observation time, quality state, and licence boundaries.
  - Demo or fallback records are never presented as verified official data.
  - Django checks, lint, and deterministic tests remain green.
